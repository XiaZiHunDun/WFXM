services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: butler_v5
      POSTGRES_USER: butler
      POSTGRES_PASSWORD: butler_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U butler -d butler_v5"]
      interval: 5s
      timeout: 5s
      retries: 5

  wechat-mock:
    image: node:20-alpine
    working_dir: /app
    command: ["node", "wechat-mock.mjs"]
    ports:
      - "3001:3001"
    volumes:
      - ./scripts/wechat-mock.mjs:/app/wechat-mock.mjs

volumes:
  pgdata:
