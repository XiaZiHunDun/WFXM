name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 18 * * 1-5"
  workflow_dispatch:

jobs:
  butler-v5-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm (pinned to 9.15.0 to match dev + lockfile v9)
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: butler-v5/node_modules
          key: ${{ runner.os }}-pnpm-butler-v5-${{ hashFiles('butler-v5/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-butler-v5-

      - name: Install dependencies
        working-directory: butler-v5
        run: pnpm install --frozen-lockfile

      - name: Pre-commit + commit-msg hook sync check
        run: |
          HOOKS=(
            "pre_commit_hook.sh pre-commit"
            "commit_msg_hook.sh commit-msg"
          )
          DRIFT=0
          for entry in "${HOOKS[@]}"; do
            source_name="${entry% *}"
            target_name="${entry#* }"
            SOURCE="scripts/ai_guard/$source_name"
            TARGET=".git/hooks/$target_name"
            if [ ! -f "$SOURCE" ]; then
              echo "⚠️  source missing: $SOURCE" && continue
            fi
            if [ ! -f "$TARGET" ]; then
              echo "ℹ️  installed $target_name absent (CI sandbox?) — skip"
              continue
            fi
            if ! diff -q "$SOURCE" "$TARGET" > /dev/null; then
              echo "❌ installed $target_name drifted from source"
              echo "   Run: bash scripts/ai_guard/install-pre-commit-hook.sh"
              diff "$SOURCE" "$TARGET" | head -20
              DRIFT=1
            else
              echo "✅ $target_name in sync"
            fi
          done
          if [ "$DRIFT" -ne 0 ]; then
            exit 1
          fi

      - name: Format check
        working-directory: butler-v5
        run: pnpm format:check

      - name: Lint
        working-directory: butler-v5
        run: pnpm lint

      - name: Typecheck
        working-directory: butler-v5
        run: bash scripts/typecheck-gate.sh

      - name: Unit / contract tests
        working-directory: butler-v5
        run: pnpm test

      - name: WeChat acceptance harness (deterministic)
        working-directory: butler-v5
        run: pnpm vitest run tests/acceptance --pool=forks

      - name: Loopback smoke regression (quick, no iLink)
        working-directory: butler-v5
        run: bash scripts/cutover/ci-smoke-regression.sh

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: butler-v5-test-log-${{ github.run_id }}
          path: butler-v5/test-output.txt
          if-no-files-found: warn
